<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OsteoGame Host</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/vendor/qrcode.min.js"></script>
  </head>
  <body>
    <div class="wrap col" style="gap:16px;">
      <h2>Host a Room</h2>
      <div class="card col" style="gap: 12px;">
        <label class="muted">Optional PIN (leave blank to use server default)</label>
        <div class="row">
          <input id="pin" placeholder="PIN (optional)" />
          <button id="create">Create Room</button>
        </div>
        <label class="muted">QR base URL (set to your LAN IP so phones can reach the server)</label>
        <input id="baseUrl" placeholder="http://192.168.10.159:3000" />
      </div>

      <div id="room" class="card col" style="gap:12px; display:none;">
        <div>Room Code: <b id="roomId"></b></div>
        <div>PIN: <b id="roomPin"></b> <span class="muted">(required for joining if shown)</span></div>
        <div class="qr" id="qr"></div>
        <div class="muted">Players can scan the QR to join from their phones.</div>
        <div class="row">
          <input id="joinUrl" readonly style="flex:1" />
          <button id="copyLink">Copy Link</button>
          <button id="openPlay">Open Play</button>
          <button id="startRound" style="background:#243b2e;border-color:#335b46;">Start Round</button>
        </div>
        <div class="notice" id="roomStatus" style="display:none;"></div>
        <div class="row" style="gap:8px;">
          <button id="refreshStatus" style="flex:1; background:#1b2538; border-color:#29406a;">Refresh Status</button>
          <button id="regen" style="flex:1; background:#3a1d2b; border-color:#5c2f42;">Regenerate Cues & Pellets</button>
        </div>
      </div>
    </div>
    <script>
      const byId = (id) => document.getElementById(id);
      const baseUrlInput = byId('baseUrl');
      const defaultOrigin = `${location.protocol}//${location.host}`;
      const savedBase = (typeof localStorage !== 'undefined' && localStorage.getItem('hostBaseUrl')) || '';
      baseUrlInput.value = savedBase || defaultOrigin;
      baseUrlInput.addEventListener('change', () => {
        const value = baseUrlInput.value.trim();
        if (typeof localStorage !== 'undefined') {
          localStorage.setItem('hostBaseUrl', value);
        }
      });

      function resolveBaseUrl() {
        let raw = baseUrlInput.value.trim();
        if (!raw) raw = defaultOrigin;
        if (!/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(raw)) {
          raw = `http://${raw}`;
        }
        return raw.replace(/\/+$/, '');
      }

      byId('create').addEventListener('click', async () => {
        const pin = byId('pin').value.trim();
        const res = await fetch('/api/create-room', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin: pin || undefined }) });
        const data = await res.json();
        const joinUrl = `${resolveBaseUrl()}/play?room=${data.roomId}`;
        byId('room').style.display = '';
        byId('roomId').textContent = data.roomId;
        byId('roomPin').textContent = data.pin || '(none)';
        byId('joinUrl').value = joinUrl;
        const qrNode = byId('qr');
        qrNode.innerHTML = '';
        new QRCode(qrNode, {
          text: joinUrl,
          width: 240,
          height: 240,
          colorDark: '#e6eef7',
          colorLight: '#0d0f14',
          correctLevel: QRCode.CorrectLevel.M
        });
        const updateStatus = async () => {
          const status = byId('roomStatus');
          status.style.display = 'block';
          status.textContent = 'Loading world status...';
          try {
            const r = await fetch(`/api/rooms/${data.roomId}/summary`);
            const json = await r.json();
            if (!r.ok) throw new Error(json?.error || `HTTP ${r.status}`);
            status.innerHTML = `Cues: <b>${json.cues}</b> | Pellets: <b>${json.pellets}</b> | Players: <b>${json.players}</b> | Phase: <b>${json.round?.phase}</b>`;
          } catch (e) {
            status.textContent = 'Status error: ' + (e?.message || 'unknown');
          }
        };

        byId('copyLink').onclick = async () => {
          try { await navigator.clipboard.writeText(joinUrl); byId('copyLink').textContent = 'Copied!'; setTimeout(()=>byId('copyLink').textContent='Copy Link', 1200);} catch {}
        };
        byId('openPlay').onclick = () => { window.open(joinUrl, '_blank'); };
        byId('startRound').onclick = async () => {
          try {
            const r = await fetch('/api/start-round', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ roomId: data.roomId }) });
            const json = await r.json().catch(()=>({}));
            if (!r.ok) throw new Error(json?.error || `HTTP ${r.status}`);
            byId('startRound').textContent = 'Starting...';
            setTimeout(()=> byId('startRound').textContent = 'Start Round', 2000);
            updateStatus();
          } catch (e) {
            alert('Could not start round: ' + (e?.message || 'unknown'));
          }
        };
        byId('refreshStatus').onclick = updateStatus;
        byId('regen').onclick = async () => {
          try {
            const r = await fetch(`/api/rooms/${data.roomId}/regenerate`, { method: 'POST' });
            const json = await r.json();
            if (!r.ok) throw new Error(json?.error || `HTTP ${r.status}`);
            byId('roomStatus').textContent = `Regenerated cues (${json.cues}) and pellets (${json.pellets}).`;
          } catch (e) {
            alert('Regenerate failed: ' + (e?.message || 'unknown'));
          }
        };

        updateStatus();
      });
    </script>
  </body>
  </html>
